<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ATX Let's Play — Find games, connect with players, and explore courts across Austin's neighborhoods." />
    <meta name="theme-color" content="#0a0e17" />
    <title>ATX Let's Play</title>
  </head>
  <body>
    <div id="root">
      <style>
        .pre-loader {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          background: #0a0e17;
          z-index: 9999;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pre-loader-video {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 100vw;
          height: 100vh;
          object-fit: cover;
          transform: translate(-50%, -50%);
          pointer-events: none;
        }
        .pre-loader-overlay {
          position: relative;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(10, 14, 23, 0.6);
          padding: 1rem 2rem;
          border-radius: 12px;
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pre-loader-text {
          font-family: sans-serif;
          font-size: 1.25rem;
          letter-spacing: 0.35em;
          color: #ffffff;
          margin: 0;
          animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
      </style>
      <div class="pre-loader">
        <video class="pre-loader-video" src="/assets/loadingScreen.mp4" autoplay loop muted playsinline></video>
        <div class="pre-loader-overlay">
          <p class="pre-loader-text">LOADING...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
