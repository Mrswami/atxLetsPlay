<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ATX Let's Play — Find games, connect with players, and explore courts across Austin's neighborhoods." />
    <meta name="theme-color" content="#0a0e17" />
    <title>ATX Let's Play</title>
  </head>
  <body>
    <div id="pre-loader-container">
      <style>
        .pre-loader {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          background: #0a0e17;
          z-index: 9999;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .pre-loader-video {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 100vw;
          height: 100vh;
          object-fit: cover;
          transform: translate(-50%, -50%);
          pointer-events: none;
        }
        .pre-loader-overlay {
          position: relative;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(10, 14, 23, 0.3);
          padding: 0.5rem 1rem;
          border-radius: 8px;
          backdrop-filter: blur(2px);
          -webkit-backdrop-filter: blur(2px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pre-loader-text {
          font-family: sans-serif;
          font-size: 1rem;
          font-weight: normal;
          letter-spacing: 0.3em;
          color: rgba(255, 255, 255, 0.6);
          margin: 0;
          text-align: center;
          white-space: nowrap;
          animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0; }
          50% { opacity: 0.6; }
        }
      </style>
      <div class="pre-loader">
        <style>
          .mobile-video { display: none; }
          @media (max-width: 768px) {
            .desktop-video { display: none !important; }
            .mobile-video { display: block !important; }
          }
        </style>
        <video class="pre-loader-video desktop-video" src="/assets/loadingScreen.mp4" autoplay loop muted playsinline></video>
        <video class="pre-loader-video mobile-video" src="/assets/loadingScreenMobile.mp4" autoplay loop muted playsinline></video>
        <div class="pre-loader-overlay">
          <p class="pre-loader-text">LOADING...</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
